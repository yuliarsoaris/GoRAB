<style>
/* Layout: sticky total bar on top, four work tabs at the bottom, content as stacked sheets like a printed RAB. */
:root {
  --bg: #EDF0EE;
  --surface: #FFFFFF;
  --surface2: #E2E9E7;
  --field: #F6F8F7;
  --ink: #14262B;
  --muted: #566A6E;
  --line: #C7D2CF;
  --accent: #0B6B7A;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3EAED;
  --warn: #8A5200;
  --danger: #B3261E;
  --danger-soft: #F8DEDB;
  --ok: #1B7347;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1517; --surface: #142023; --surface2: #1C2D31; --field: #0F1A1D;
    --ink: #E5EEEE; --muted: #93A8AC; --line: #2A3C40;
    --accent: #55C3D5; --accent-ink: #07252B; --accent-soft: #163A41;
    --warn: #E5A64A; --danger: #FF8F86; --danger-soft: #3B1F1D; --ok: #66C795;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1517; --surface: #142023; --surface2: #1C2D31; --field: #0F1A1D;
  --ink: #E5EEEE; --muted: #93A8AC; --line: #2A3C40;
  --accent: #55C3D5; --accent-ink: #07252B; --accent-soft: #163A41;
  --warn: #E5A64A; --danger: #FF8F86; --danger-soft: #3B1F1D; --ok: #66C795;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 10px; }
.top .who { min-width: 0; }
.kicker { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pname { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .tot { text-align: right; flex-shrink: 0; }
.top .tot b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 17px; color: var(--accent); }

main .wrap { padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .01em; }
h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
p.hint { margin: 0; font-size: 13px; color: var(--muted); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.note { background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* fields */
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input, select { width: 100%; min-width: 0; height: 42px; padding: 0 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
input[data-n] { text-align: right; font-family: var(--font-mono); font-size: 15px; }
input[readonly] { background: var(--surface2); color: var(--muted); }
select { appearance: auto; }
input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: 1fr .8fr 1.5fr; gap: 8px; }
.g3k { display: grid; grid-template-columns: 1fr .8fr 1.4fr; gap: 8px; }

/* buttons */
button { font: inherit; cursor: pointer; }
.btn { height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; }
.katmv { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.pick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.pick label { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.pick input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { height: 34px; padding: 0 10px; font-size: 13px; }
.btn[data-danger] { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn[data-armed="1"] { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > .btn { flex: 1 1 140px; }

/* project list */
.plist { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.prow .pcard { flex: 1 1 200px; min-width: 0; }
.prow .btn { flex: 0 0 auto; }
.pcard { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; background: var(--field); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
.pcard[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pcard .pn { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.pcard .pl { font-size: 12.5px; color: var(--muted); }
.pcard .pt { font-family: var(--font-mono); font-size: 13px; flex-shrink: 0; }

/* RAB sheets */
.div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.div-h { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; padding: 10px 12px; background: var(--surface2); }
.roman { font-family: var(--font-display); font-weight: 700; font-size: 22px; min-width: 28px; }
.div-h input { height: 38px; font-weight: 600; background: var(--surface); }
.div-h select { grid-column: 2; height: 38px; font-weight: 600; color: var(--ink); background: var(--surface); }
.div-sub { grid-column: 2; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.tgl { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; }
.sub-r { white-space: nowrap; }
.div-sub b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); font-size: 14px; }
.items { display: flex; flex-direction: column; }
.item { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
.item-top { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.no { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 20px; }
.item-bot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.item-note { font-size: 12.5px; color: var(--warn); }
.item-bot .jml { font-family: var(--font-mono); font-weight: 500; font-size: 15px; text-align: right; }
.div-f { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.div-f .btn { flex: 1 1 130px; }
.empty { padding: 14px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.tag { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

/* AHSP */
details.ahsp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
details.ahsp > summary { list-style: none; cursor: pointer; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
details.ahsp > summary::-webkit-details-marker { display: none; }
.s-name { font-weight: 600; overflow-wrap: anywhere; }
.s-price { font-family: var(--font-mono); font-size: 14px; color: var(--accent); text-align: right; }
.ahsp-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.kom { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.kom-top { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.kom-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kom-bot b { font-family: var(--font-mono); font-weight: 500; }
.ahsp-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12.5px; color: var(--muted); }
.ahsp-sum b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--ink); }

/* Rekap */
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.line:last-child { border-bottom: 0; }
.line span:first-child { min-width: 0; overflow-wrap: anywhere; }
.line .v { font-family: var(--font-mono); font-size: 14px; text-align: right; flex-shrink: 0; }
.line.strong { font-weight: 600; }
.line.total { border-bottom: 0; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.line.total .v { font-size: 18px; color: var(--accent); }
.pct { font-size: 12px; color: var(--muted); font-family: var(--font-mono); margin-left: 6px; }
.terbilang { font-style: italic; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
textarea.copybox { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: 13px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: flex; gap: 2px; padding-block: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; min-width: 54px; height: 50px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .01em; line-height: 1.05; text-align: center; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mcard .used { font-size: 12.5px; color: var(--muted); }
.mcard-bot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.mcard-act { display: flex; gap: 6px; margin-left: auto; }
.mv { min-width: 44px; padding: 0 8px; }
.dm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.dm-row .roman { padding-top: 4px; }
.dm-row .mcard-act { margin-left: 0; padding-top: 2px; }
.dm-name { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dm-name small { font-size: 12px; color: var(--muted); }
details.grp.nonum > summary { grid-template-columns: 1fr auto; }
.dm-row.nonum { grid-template-columns: 1fr auto; }
@media (max-width: 440px) { .dm-row { grid-template-columns: auto 1fr; } .dm-row .mcard-act { grid-column: 2; } .dm-row.nonum { grid-template-columns: 1fr; } .dm-row.nonum .mcard-act { grid-column: 1; } }
details.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
details.grp > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface2); }
details.grp > summary::-webkit-details-marker { display: none; }
.g-name { font-weight: 600; overflow-wrap: anywhere; }
.g-count { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.g-count::after { content: " \25B8"; }
details.grp[open] .g-count::after { content: " \25BE"; }
.grp-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 12; max-width: min(92vw, 420px); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .15s; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 380px) { .g2 { grid-template-columns: 1fr; } .tab small { display: none; } }
/* BQ dan RKS */
textarea.rksbox { width: 100%; min-height: 110px; padding: 9px 10px; font: inherit; font-size: 15px; line-height: 1.4; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
.bqi { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.bqi:first-child { border-top: 0; }
.bqi .no { color: var(--muted); font-size: 12.5px; }
.bqi .vol { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
/* Kurva S */
h3.sec { margin: 8px 0 0; font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; }
.kchart { width: 100%; height: auto; display: block; }
.kchart text { font-family: var(--font-body); font-size: 9px; fill: var(--muted); }
.kchart .grid { stroke: var(--line); stroke-width: .6; }
.kchart .bar { fill: var(--accent-soft); stroke: var(--accent); stroke-width: .5; }
.kchart .curve { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.kchart .dot { fill: var(--accent); }
.ktbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.ktbl th, .ktbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.ktbl th:first-child, .ktbl td:first-child { text-align: left; }
.ktbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
.krow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: end; padding: 8px 0; border-top: 1px solid var(--line); }
.krow:first-child { border-top: 0; padding-top: 0; }
.krow-t { grid-column: 1 / -1; font-size: 14px; overflow-wrap: anywhere; }
.krow-t b { color: var(--accent); font-family: var(--font-mono); font-size: 12.5px; margin-left: 6px; white-space: nowrap; }
.krow .g2 { grid-column: 1 / -1; }
</style>
</head>

  /* ---------- Kurva S: bobot tiap item = jumlah harga / total RAB, disebar rata sepanjang durasinya ---------- */

      case 'add-kat':
        var inp = document.getElementById('kat-new'), kn = inp ? inp.value.replace(/\s+/g, ' ').trim() : '';
        if (!kn) { toast('Ketik nama kategori dulu.'); if (inp) inp.focus(); return; }
        if (S.katBahan.some(function (k) { return k.toLowerCase() === kn.toLowerCase(); })) { toast('Kategori itu sudah ada.'); return; }
        S.katBahan.push(kn); grpState['k:' + kn] = true; touch(); render(); toast('Kategori "' + kn + '" ditambahkan.'); return;
      case 'del-mst':
        x = masterById(id);
        S.ahsp.forEach(function (a) { a.komponen.forEach(function (k) { if (k.ref === id) { k.ref = ''; k.nama = x.nama; k.satuan = x.satuan; k.harga = hargaM(x, p); } }); });
        S.projects.forEach(function (q) { if (q.hrg) delete q.hrg[id]; });
        Object.keys(JENIS).forEach(function (j) { S.master[j] = S.master[j].filter(function (m) { return m.id !== id; }); });
        touch(); render(); toast('Dihapus. Komponen AHSP yang memakainya kini berharga manual.'); return;
      case 'pick':
        PICK[id] = !!b.checked; try { localStorage.setItem('rab-gedung-pick', JSON.stringify(PICK)); } catch (e) { /* abaikan */ }
        return;
      case 'export-pdf':
        if (!PICK_LIST.some(function (x) { return PICK[x[0]]; })) { toast('Pilih minimal satu bagian untuk disimpan.'); return; }
        exportPDF(p); return;
      case 'auto-jadwal': if (autoJadwal(p)) { touch(); render(); toast('Jadwal diisi otomatis. Silakan sesuaikan.'); } else toast('Isi volume di tab RAB dulu.'); return;
      case 'rks-isi': var nr = rksIsi(p); if (nr) { touch(); render(); toast(nr + ' bagian diisi dengan templat. Silakan sesuaikan.'); } else toast('Semua bagian sudah terisi.'); return;
      case 'export-html': exportHTML(p); return;
      case 'export-xlsx':
        if (!PICK_LIST.some(function (x) { return PICK[x[0]]; })) { toast('Pilih minimal satu bagian untuk disimpan.'); return; } exportXLSX(p); return;
      case 'export-csv': save(slug(p.nama) + '-RAB.csv', buildCSV(p)); return;
      case 'export-json': save('cadangan-rab-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S, null, 1)); return;
      case 'import-json': $('#file-in').click(); return;
      case 'copy-sum':
        x = summaryText(p);
        var show = function () { var area = $('#copy-area'); area.innerHTML = '<textarea class="copybox" readonly id="copy-text" aria-label="Ringkasan RAB"></textarea>'; var ta = $('#copy-text'); ta.value = x; ta.focus(); ta.select(); };
        try { navigator.clipboard.writeText(x).then(function () { toast('Ringkasan disalin.'); }, show); } catch (e) { show(); }
        return;
    }
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    if (b.dataset.danger !== undefined && b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.dataset.label = b.textContent; b.textContent = 'Ketuk lagi untuk memastikan';
      setTimeout(function () { if (b.isConnected && b.dataset.armed === '1') { b.dataset.armed = ''; b.textContent = b.dataset.label; } }, 3200);
      return;
    }
    act(b.dataset.act, b.dataset.id, b);
  });
  document.addEventListener('input', function (e) {
    var t = e.target, d = t.dataset; if (!d || !d.f) return;
    if (d.t === 'divpick') {
      var dv = findDiv(ap(), d.id);
      if (dv && t.value) { dv.nama = t.value; touch(); render(); toast('Nama divisi diubah menjadi ' + t.value + '.'); }
      return;
    }
    var o = find(d.t, d.id); if (!o) return;
    if (d.t === 'mst' && d.f === 'harga') { var pq = ap(); pq.hrg = pq.hrg || {}; pq.hrg[d.id] = parse(t.value); touch(); refresh(); return; }
    o[d.f] = d.n ? parse(t.value) : t.value;
    if (d.t === 'proj' && d.f === 'nama') o.contoh = false;
    if (d.t === 'ahsp' && d.f === 'div') {
      var tg = S.ahspDiv.filter(function (x) { return x.nama.trim() === t.value.trim(); })[0];
      grpState[tg ? 'g' + tg.id : 'x'] = true; touch(); render(); return;
    }
    if (d.t === 'mst' && d.f === 'kat') { grpState['k:' + t.value] = true; touch(); render(); toast('Dipindah ke ' + (t.value || 'Tanpa kategori') + '.'); return; }
    if (d.t === 'kom' && d.f === 'jenis') { o.ref = ''; touch(); render(); return; }
    if (d.t === 'kom' && d.f === 'ref') {
      var m = masterById(t.value);
      if (m) { o.nama = m.nama; o.satuan = m.satuan; o.harga = m.harga; o.ref = m.id; } else o.ref = '';
      touch(); render(); return;
    }
    if (d.t === 'item' && d.f === 'ahsp') {
      var a = ahspById(t.value);
      if (a) { o.uraian = a.nama; o.satuan = a.satuan || ''; o.harga = 0; } else { o.ahsp = ''; o.uraian = ''; o.satuan = ''; o.harga = 0; }
      touch(); render(); return;
    }
    touch(); refresh();
    if (d.t === 'ahsp' && d.f === 'satuan') { /* satuan item mengikuti saat AHSP dipilih lagi */ }
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.search) return;
    var q = t.value.trim().toLowerCase();
    document.querySelectorAll('.mcard').forEach(function (c) { c.hidden = !!q && c.dataset.q.indexOf(q) < 0; });
    document.querySelectorAll('#view details.grp').forEach(function (g) {
      var cs = g.querySelectorAll('.mcard'); if (!cs.length) return;
      var any = Array.prototype.some.call(cs, function (c) { return !c.hidden; });
      g.hidden = !!q && !any; if (q && any) g.open = true;
    });
  });
  /* Mengganti nama divisi di tab AHSP ikut memindahkan AHSP di dalamnya. Mengganti nama divisi di tab RAB tidak memengaruhi AHSP. */
  var renameFrom = {};
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t.dataset || t.dataset.katname === undefined) return;
    var old = t.dataset.katname, nn = t.value.replace(/\s+/g, ' ').trim(), i = S.katBahan.indexOf(old);
    if (i < 0 || nn === old) { t.value = old; return; }
    if (!nn) { toast('Nama kategori tidak boleh kosong.'); t.value = old; return; }
    if (S.katBahan.some(function (k, q) { return q !== i && k.toLowerCase() === nn.toLowerCase(); })) { toast('Nama kategori itu sudah dipakai.'); t.value = old; return; }
    S.katBahan[i] = nn; S.master.bahan.forEach(function (m) { if (m.kat === old) m.kat = nn; });
    grpState['k:' + nn] = grpState['k:' + old]; delete grpState['k:' + old]; touch(); render(); toast('Nama kategori diubah.');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.katname !== undefined) { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Enter' && e.target.id === 'dm-new') { e.preventDefault(); act('add-div'); }
    if (e.key === 'Enter' && e.target.id === 'am-new') { e.preventDefault(); act('add-adiv'); }
    if (e.key === 'Enter' && e.target.id === 'kat-new') { e.preventDefault(); act('add-kat'); }
  });
  document.addEventListener('focusin', function (e) {
    var d = e.target.dataset;
    if (d && d.t === 'adiv' && d.f === 'nama') { var o = find('adiv', d.id); if (o) renameFrom[d.id] = o.nama; }
  });
  document.addEventListener('focusout', function (e) {
    var d = e.target.dataset; if (!d || d.t !== 'adiv' || d.f !== 'nama') return;
    var from = renameFrom[d.id], o = find('adiv', d.id); delete renameFrom[d.id];
    if (!from || !o || !o.nama.trim() || o.nama === from) return;
    var moved = false;
    S.ahsp.forEach(function (a) { if ((a.div || '').trim() === from.trim()) { a.div = o.nama; moved = true; } });
    if (moved) touch();
  });
  document.addEventListener('focusout', function (e) {
    var t = e.target; if (t.dataset && t.dataset.n && !t.readOnly) { var v = parse(t.value); t.value = v === 0 ? '' : (t.dataset.plain ? String(Math.round(v)) : num(v)); }
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d.dataset && d.dataset.gid) grpState[d.dataset.gid] = d.open;
    if (d.dataset && d.dataset.aid) { if (d.open) openAhsp[d.dataset.aid] = true; else delete openAhsp[d.dataset.aid]; }
  }, true);
  $('#file-in').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { var d = norm(JSON.parse(r.result)); d.updatedAt = Date.now(); S = d; touch(); render(); toast('Cadangan dibuka.'); }
      catch (err) { toast('File ini bukan cadangan RAB yang valid.'); }
    };
    r.readAsText(f); e.target.value = '';
  });

  S = loadLocal();
  /* Berkas .html yang dibagikan membawa data pengirim. Data dipakai satu kali per berkas; bila perangkat sudah punya data sendiri, pengguna ditanya dulu. */
  if (window.__RAB_SEED && window.__RAB_SEED.data) {
    var seedAt = String(window.__RAB_SEED.at || ''), seen = '';
    try { seen = localStorage.getItem(KEY + '-seed') || ''; } catch (e) { seen = ''; }
    if (seedAt && seen !== seedAt) {
      var sd = null; try { sd = norm(window.__RAB_SEED.data); } catch (e) { sd = null; }
      if (sd) {
        var pakai = !S || S.projects.every(function (q) { return q.contoh; });
        if (!pakai) { try { pakai = window.confirm('File ini membawa data proyek dari pengirim. Pakai data dari file ini?\n\nData di perangkat ini akan diganti. Simpan cadangan dulu bila perlu.'); } catch (e) { pakai = false; } }
        if (pakai) { S = sd; S.updatedAt = Date.now(); touch(); }
      }
      try { localStorage.setItem(KEY + '-seed', seedAt); } catch (e) { /* abaikan */ }
    }
  }
  S = S || sample();
  setStatus();
  render();
  connectRemote();
})();
</script>
</body>
</html>
